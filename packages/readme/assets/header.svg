<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-labelledby="title">
  <title id="title">Biprodas Roy — Software Engineer · Full Stack Developer · AI Researcher</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB" />
      <stop offset="1" stop-color="#06B6D4" />
    </linearGradient>
    <!-- Soft left/right edges for the waves. -->
    <linearGradient id="edge-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0" />
      <stop offset="0.18" stop-color="#fff" stop-opacity="1" />
      <stop offset="0.82" stop-color="#fff" stop-opacity="1" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <mask id="edges"><rect width="1000" height="260" fill="url(#edge-fade)" /></mask>
    <!-- Waves dissolve toward the bottom instead of ending in a hard edge. -->
    <linearGradient id="bottom-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.72" stop-color="#fff" stop-opacity="1" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <mask id="bottom"><rect width="1000" height="260" fill="url(#bottom-fade)" /></mask>
    <clipPath id="typed"><rect class="typing" x="183" y="150" width="638" height="44" /></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .prompt { font-size: 17px; fill: #0891B2; }
    .name { font-size: 68px; font-weight: 800; letter-spacing: -1.5px; }
    .title { font-size: 22px; font-weight: 600; letter-spacing: 0.5px; fill: #7D8590; white-space: pre; }
    .sep { fill: #06B6D4; font-weight: 800; }
    .in { animation: rise 0.7s cubic-bezier(.2, .7, .2, 1) backwards; }
    .bar { transform-box: fill-box; transform-origin: center; animation: grow 0.8s 0.45s cubic-bezier(.2, .7, .2, 1) backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
    @keyframes grow { from { transform: scaleX(0); } }
    .typing { transform-box: fill-box; transform-origin: left; animation: reveal 3.3s steps(60, end) 0.7s backwards; }
    .caret { fill: #06B6D4; animation: caret 3.3s steps(60, end) 0.7s backwards, blink 1s step-end 4s infinite; }
    @keyframes reveal { from { transform: scaleX(0); } }
    @keyframes caret { from { transform: translateX(-634px); } }
    @keyframes blink { 50% { opacity: 0; } }
    .wave-back { opacity: 0.12; animation: drift-left 18s linear infinite; }
    .wave-front { opacity: 0.18; animation: drift-right 12s linear infinite; }
    @keyframes drift-left { to { transform: translateX(-320px); } }
    @keyframes drift-right { from { transform: translateX(-260px); } to { transform: translateX(0); } }
    @media (prefers-reduced-motion: reduce) { .in, .bar, .typing, .caret, .wave-back, .wave-front { animation: none; } }
  </style>

  <g mask="url(#edges)"><g mask="url(#bottom)">
    <path class="wave-back" d="M0 208 q 80 -12 160 0 t 160 0 q 80 -12 160 0 t 160 0 q 80 -12 160 0 t 160 0 q 80 -12 160 0 t 160 0 q 80 -12 160 0 t 160 0 q 80 -12 160 0 t 160 0 V 260 H 0 Z" fill="url(#accent)" />
    <path class="wave-front" d="M0 224 q 65 -9 130 0 t 130 0 q 65 -9 130 0 t 130 0 q 65 -9 130 0 t 130 0 q 65 -9 130 0 t 130 0 q 65 -9 130 0 t 130 0 q 65 -9 130 0 t 130 0 V 260 H 0 Z" fill="url(#accent)" />
  </g></g>

  <text x="500" y="40" text-anchor="middle" class="mono prompt in">~/biprodas.roy $ whoami</text>
  <text x="500" y="118" text-anchor="middle" class="sans name in" fill="url(#accent)" style="animation-delay: .15s">Biprodas Roy</text>
  <rect class="bar" x="455" y="138" width="90" height="4" rx="2" fill="url(#accent)" />
  <text x="183" y="180" textLength="634" lengthAdjust="spacingAndGlyphs" class="sans title" clip-path="url(#typed)">Software Engineer<tspan class="sep">  ·  </tspan>Full Stack Developer<tspan class="sep">  ·  </tspan>AI Researcher</text>
  <rect class="caret" x="821" y="161" width="2.5" height="24" rx="1" />
</svg>
