# One entry per organization. Promotions = several positions in the same entry;
# the entry's title/start/end are derived from its positions.
#
# - id: kebab-case                       # required, unique
#   audience: both                       # academic | engineering | both
#   draft: false                         # true = hidden on every site
#   org: { name, url, logo, industry, location: { city, region, country } }
#   employmentType: full-time            # full-time | part-time | contract | freelance | internship |
#                                        # self-employed | founder | apprenticeship | volunteer
#   workMode: remote                     # on-site | remote | hybrid
#   location: { city, country }          # where YOU worked from, if different from org.location
#   positions:                           # newest first or any order; at least one
#     - { title, start: "YYYY-MM", end: "YYYY-MM" | present, employmentType?, workMode?, summary? }
#   summary: one line
#   highlights: [ ... ]
#   tech: [ ... ]
#   projects: [ project-id, ... ]        # ids from projects.yaml
#   links: [ { kind, url, label } ]
#   featured: false

- id: must-company
  org:
    name: MUST Company
    location: { city: Seoul, country: South Korea }
  workMode: remote
  positions:
    - title: Software Engineer
      start: "2024-05"
      end: "2026-06"
  tech: [Python, FastAPI, DynamoDB, Next.js, TypeScript]
  highlights:
    - Developed MustBreak, an AI-powered real-time meeting platform for transcription, translation,
      and multilingual collaboration across distributed teams — with AI-generated summaries and
      searchable conversation history.
    - Integrated Slack workflows and low-latency real-time communication infrastructure to support
      enterprise-grade multilingual collaboration.
    - Developed responsive frontend features for MSquare Market, a blockchain-based digital asset
      marketplace, implementing crypto wallet connection flows and transaction UIs.

