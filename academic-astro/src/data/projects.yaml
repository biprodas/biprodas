- id: pitchpool
  title: PitchPool
  summary: >-
    Multi-tenant SaaS platform for competition prediction pools with automated scoring, live
    leaderboards, and subscription billing.
  description: >-
    PitchPool runs prediction competitions. Participants join pools, predict match results and
    follow live leaderboards that update as each result is scored automatically. Every tenant gets
    its own isolated pools, participants and roles, and subscription plans decide which features a
    tenant can use.
  type: product
  status: in-progress
  role: Founder & sole engineer
  featured: true
  links:
    - { kind: live, url: "https://pitchpool.io" }
    # repo: github.com/biprodas/pitchpool is private — add { kind: repo, url } if made public
  tech: [Next.js, React, TypeScript, NestJS, PostgreSQL, Prisma, Redis, BullMQ, JWT/OAuth, Docker]
  topics: [SaaS, Multi-tenancy, Billing]
  highlights:
    - Shipped subscription billing (plans, entitlement gating, and webhooks) behind a
      provider-agnostic gateway; designed three-tier RBAC with privilege-escalation safeguards.
    - Cut idle database traffic by ~90% through in-memory job scheduling and consolidated tasks,
      enabling serverless PostgreSQL to scale to zero.
    - Built BullMQ ingestion with rate limiting, circuit breaking, and retry/backoff — leaderboards
      held accurate through match-day spikes.

